<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slime Forge sound picker</title>
<style>
  :root { --bg:#1d1630; --card:#2b2147; --ink:#f3ebff; --mute:#b9a9d9; --gold:#ffd36b; --ok:#7be0a4; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui, sans-serif; padding:0 16px 120px; }
  header { max-width:900px; margin:0 auto; padding:24px 0 8px; }
  h1 { margin:0 0 6px; font-size:26px; }
  h2 { margin:28px 0 8px; font-size:19px; color:var(--gold); }
  p.help { margin:0 0 10px; color:var(--mute); }
  main { max-width:900px; margin:0 auto; }
  .slot { background:var(--card); border-radius:14px; padding:12px 14px; margin:10px 0; }
  .slot h3 { margin:0 0 2px; font-size:16px; }
  .slot small { color:var(--mute); display:block; margin-bottom:8px; }
  .opts { display:flex; flex-wrap:wrap; gap:8px; }
  label.opt { display:flex; align-items:center; gap:6px; background:#3a2d5e; border:2px solid transparent; border-radius:10px; padding:6px 10px 6px 6px; cursor:pointer; }
  label.opt:has(input:checked) { border-color:var(--ok); background:#2f4a46; }
  label.opt input { accent-color:var(--ok); }
  button.play { width:34px; height:34px; border-radius:50%; border:0; background:var(--gold); color:#2b2147; font-size:15px; cursor:pointer; }
  button.play:active { transform:scale(.92); }
  .name { font-size:13px; color:var(--mute); }
  .shelf { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:6px; }
  .shelf .opt { padding:4px 8px 4px 4px; }
  select { background:#3a2d5e; color:var(--ink); border:2px solid #4b3b77; border-radius:10px; padding:8px; font-size:15px; }
  .musicrow { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:6px 0; }
  .musicrow b { width:210px; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:#120d22; border-top:2px solid #4b3b77; padding:10px 16px; display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .bar button.main { background:var(--ok); color:#12301f; border:0; border-radius:12px; padding:10px 18px; font-weight:700; font-size:16px; cursor:pointer; }
  textarea { width:100%; height:140px; background:#120d22; color:var(--ink); border:2px solid #4b3b77; border-radius:10px; padding:10px; font:13px/1.4 ui-monospace, monospace; }
  #count { color:var(--mute); }
</style>
</head>
<body>
<header>
  <h1>Slime Forge sound picker</h1>
  <p class="help">Press the round gold button to hear a sound. Tick the one you like best for each moment. When you are done, press <b>Copy my picks</b> at the bottom and paste the text to Claude. Anything you leave unticked keeps my current choice.</p>
</header>
<main id="app"></main>
<div class="bar">
  <span id="count"></span>
  <button class="main" id="copy">Copy my picks</button>
  <button class="main" id="stop" style="background:#ffd36b;color:#2b2147">Stop sound</button>
</div>

  ['ritual_start', 'Breeding ritual starts (magic build-up)', [M+'mixkit-fairy-magic-sparkle-871.wav',M+'mixkit-magic-sparkle-whoosh-2350.wav',K+'maximize_002.ogg',K+'maximize_009.ogg',K+'glass_003.ogg']],
  ['bond_chime', 'Two slimes bond (soft chime)', [M+'mixkit-page-forward-single-chime-1107.wav',K+'glass_001.ogg',K+'glass_002.ogg',K+'glass_004.ogg',K+'confirmation_003.ogg']],
  ['STINGERS (short jingles, 2 to 6 seconds)', null],
  ['new_slime', 'A new slime hatched', [...jing('Pizzicato jingles','PIZZI',17).slice(0,8), ...jing('8-Bit jingles','NES',17).slice(0,4)]],
  ['achievement', 'Achievement unlocked / level up', [...jing('Steel jingles','STEEL',17).slice(0,8), ...jing('Sax jingles','SAX',17).slice(0,4)]],
  ['egg_hatch', 'Egg bursts open', [...jing('Hit jingles','HIT',17).slice(0,8), ...jing('Pizzicato jingles','PIZZI',17).slice(8,12)]],
];

const app = document.getElementById('app');
const audio = new Audio();
let currentBtn = null;
function play(src, btn) {
  audio.pause();
  audio.src = src;
  audio.currentTime = 0;
  audio.play().catch(() => {});
  if (currentBtn) currentBtn.textContent = '▶';
  currentBtn = btn; btn.textContent = '■';
  audio.onended = () => { btn.textContent = '▶'; };
}
document.getElementById('stop').onclick = () => { audio.pause(); if (currentBtn) currentBtn.textContent = '▶'; };
const short = s => s.split('/').pop().replace(/\.(ogg|wav|mp3)$/, '');
const opt = (name, src, checked) => {
  const l = document.createElement('label'); l.className = 'opt';
  l.innerHTML = '<button class="play" type="button">▶</button><input type="radio" name="' + name + '" value="' + src + '"><span class="name">' + short(src) + '</span>';
  const b = l.querySelector('button');
  b.onclick = e => { e.preventDefault(); e.stopPropagation(); play(src, b); };
  return l;
};

let sec = null;
for (const s of SLOTS) {
  if (s[1] === null) { const h = document.createElement('h2'); h.textContent = s[0]; app.appendChild(h); continue; }
  const [id, desc, list] = s;
  const d = document.createElement('div'); d.className = 'slot';
  d.innerHTML = '<h3>' + id + '</h3><small>' + desc + '</small>';
  const o = document.createElement('div'); o.className = 'opts';
  list.forEach(src => o.appendChild(opt(id, src)));
  const none = document.createElement('label'); none.className = 'opt';
  none.innerHTML = '<input type="radio" name="' + id + '" value="" checked><span class="name">keep current</span>';
  o.appendChild(none);
  d.appendChild(o); app.appendChild(d);
}

/* music assignment */
const TRACKS = [['title.ogg','a new beginning'],['home.mp3','lofi loop'],['medieval.ogg','medieval']];
const SCREENS = [['title','Title screen'],['home','Home screen / altar'],['farm','Farm'],['sanctuary_day','Habitat Isles (day)'],['sanctuary_night','Habitat Isles (night)'],['battle_map','Battle map'],['battle','Battles (nothing yet)'],['den','Breeding Den'],['bazaar','Bazaar'],['library','Codex and Achievements']];
const DEFAULT = {title:'title.ogg', home:'home.mp3', farm:'medieval.ogg', sanctuary_day:'home.mp3', sanctuary_night:'home.mp3', battle_map:'medieval.ogg', battle:'', den:'home.mp3', bazaar:'medieval.ogg', library:'home.mp3'};
const h = document.createElement('h2'); h.textContent = 'MUSIC: which track on which screen?'; app.appendChild(h);
const tp = document.createElement('div'); tp.className = 'slot';
tp.innerHTML = '<h3>Your three tracks</h3><small>Listen first, then choose below.</small>';
const to = document.createElement('div'); to.className = 'opts';
TRACKS.forEach(([f, t]) => { const l = document.createElement('label'); l.className = 'opt'; l.innerHTML = '<button class="play" type="button">▶</button><span class="name">' + t + '</span>'; const b = l.querySelector('button'); b.onclick = e => { e.preventDefault(); play(f, b); }; to.appendChild(l); });
tp.appendChild(to); app.appendChild(tp);
const mp = document.createElement('div'); mp.className = 'slot';
SCREENS.forEach(([id, label]) => {
  const r = document.createElement('div'); r.className = 'musicrow';
  r.innerHTML = '<b>' + label + '</b>';
  const sel = document.createElement('select'); sel.id = 'music_' + id;
  sel.innerHTML = '<option value="">(silence / none yet)</option>' + TRACKS.map(([f, t]) => '<option value="' + f + '"' + (DEFAULT[id] === f ? ' selected' : '') + '>' + t + '</option>').join('');
  r.appendChild(sel); mp.appendChild(r);
});
app.appendChild(mp);

/* the full jingle shelf so you can browse everything */
const shelf = document.createElement('div');
const sh = document.createElement('h2'); sh.textContent = 'BROWSE: every jingle (to find a stinger for level up, evolve, visitor, night)'; app.appendChild(sh);
const sp = document.createElement('p'); sp.className = 'help'; sp.textContent = 'Tick any you like; I will use them for level_up, evolve, visitor_arrives and the others.'; app.appendChild(sp);
const packs = [['Pizzicato jingles','PIZZI'],['Steel jingles','STEEL'],['Sax jingles','SAX'],['8-Bit jingles','NES'],['Hit jingles','HIT']];
packs.forEach(([p, pre]) => {
  const t = document.createElement('h3'); t.textContent = p; t.style.margin = '12px 0 4px'; app.appendChild(t);
  const g = document.createElement('div'); g.className = 'shelf';
  jing(p, pre, 17).forEach(src => {
    const l = document.createElement('label'); l.className = 'opt';
    l.innerHTML = '<button class="play" type="button">▶</button><input type="checkbox" class="fav" value="' + src + '"><span class="name">' + short(src) + '</span>';
    const b = l.querySelector('button'); b.onclick = e => { e.preventDefault(); e.stopPropagation(); play(src, b); };
    g.appendChild(l);
  });
  app.appendChild(g);
});

function collect() {
  const lines = [];
  SLOTS.forEach(s => { if (s[1] === null) return; const c = document.querySelector('input[name="' + s[0] + '"]:checked'); if (c && c.value) lines.push(s[0] + ' = ' + c.value); });
  SCREENS.forEach(([id]) => lines.push('music ' + id + ' = ' + (document.getElementById('music_' + id).value || 'none')));
  const favs = [...document.querySelectorAll('.fav:checked')].map(i => i.value);
  if (favs.length) lines.push('favourite jingles = ' + favs.join(', '));
  return lines.join('\n');
}
const upd = () => { document.getElementById('count').textContent = document.querySelectorAll('.slot input[type=radio]:checked:not([value=""])').length + ' picked'; };
document.addEventListener('change', upd); upd();
document.getElementById('copy').onclick = async () => {
  const text = collect();
  try { await navigator.clipboard.writeText(text); } catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  let box = document.getElementById('out');
  if (!box) { box = document.createElement('textarea'); box.id = 'out'; app.appendChild(box); }
  box.value = text; box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  document.getElementById('copy').textContent = 'Copied! Paste it to Claude';
  setTimeout(() => document.getElementById('copy').textContent = 'Copy my picks', 3000);
};
